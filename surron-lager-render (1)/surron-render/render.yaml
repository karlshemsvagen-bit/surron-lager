services:
  - type: web
    name: surron-lager
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: surron-lager-db
          property: connectionString
      - key: NODE_VERSION
        value: 20

databases:
  - name: surron-lager-db
    region: frankfurt
    plan: free
    postgresMajorVersion: 16
